[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pointer-cursors"
dynamic = ["version"]
description = "Adaptive black-and-white Windows cursor theme with reversible installation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
pointer = "pointer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}
