name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Validate version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid VERSION' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw 'The release tag must match VERSION'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test
        run: python -m unittest discover -s tests
      - name: Build package
        run: python build_release.py
      - name: Diagnose packaged executable
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'pointer-diagnostics.json'
          $executable = (Resolve-Path -LiteralPath 'dist/Pointer/Pointer.exe').Path
          $arguments = '--diagnose --quiet --report "' + $report + '"'
          $process = Start-Process -FilePath $executable -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged diagnosis exited with $($process.ExitCode)" }
          if (-not (Test-Path -LiteralPath $report)) { throw 'Missing diagnostic report' }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($null -eq $result.exit_code -or $result.exit_code -ne 0) { throw 'Packaged diagnosis failed' }
          if ($result.cursor_resources -ne 34 -or $result.animated_resources -ne 4 -or -not $result.frozen) {
            throw 'Incomplete packaged cursor resources'
          }
      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64
          path: |
            dist/Pointer-v${{ steps.version.outputs.version }}-windows-x64.zip
            dist/Pointer-v${{ steps.version.outputs.version }}-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-x64
          path: release
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $package = "release/Pointer-v$env:RELEASE_VERSION-windows-x64.zip"
          $checksum = "$package.sha256"
          $expected = ((Get-Content -LiteralPath $checksum -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash
          if ($actual -ine $expected) { throw 'Release archive checksum mismatch' }
          $notes = @'
          下载并完整解压 Windows x64 ZIP，双击其中的“一键安装.cmd”或“install.cmd”。
          无需 Python、管理员权限或联网；安装后可在开始菜单的 Pointer 文件夹中启用、停止、恢复原光标或打开测试页。
          发布包尚未签名；SHA-256 校验文件随包提供。
          '@
          $notesPath = Join-Path $env:RUNNER_TEMP 'pointer-release-notes.md'
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          gh release create $env:RELEASE_TAG $package $checksum --verify-tag --title "Pointer $env:RELEASE_TAG" --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed' }
