name: Windows release

on:
  workflow_dispatch:
  push:
    branches: [DEV]
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements/build.txt
            requirements/runtime.txt
      - name: Validate version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(-beta\.[1-9]\d*)?$') { throw 'Invalid VERSION' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw 'The release tag must match VERSION'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements/build.txt
          python -m pip install --no-deps -e .
      - name: Test
        run: python -m unittest discover -s tests
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build package
        run: python -m scripts.build_release
      - name: Diagnose packaged executable
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'pointer-diagnostics.json'
          $executable = (Resolve-Path -LiteralPath 'dist/Pointer/Pointer.exe').Path
          $arguments = '--diagnose --quiet --report "' + $report + '"'
          $process = Start-Process -FilePath $executable -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged diagnosis exited with $($process.ExitCode)" }
          if (-not (Test-Path -LiteralPath $report)) { throw 'Missing diagnostic report' }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($null -eq $result.exit_code -or $result.exit_code -ne 0) { throw 'Packaged diagnosis failed' }
          if ($result.cursor_resources -ne 34 -or $result.animated_resources -ne 4 -or -not $result.frozen) {
            throw 'Incomplete packaged cursor resources'
          }
          if ($result.click_resources -ne 32) { throw 'Incomplete click animation resources' }
          if (-not $result.qt_version) { throw 'Missing Qt runtime' }
      - name: Isolated package installation and upgrade
        shell: pwsh
        run: |
          $env:POINTER_PACKAGE_ROOT = (Resolve-Path -LiteralPath dist/Pointer).Path
          python -m unittest tests.integration.test_packages
          if ($LASTEXITCODE -ne 0) { throw 'Package lifecycle checks failed' }
      - name: Installer smoke test
        shell: pwsh
        run: |
          python -m scripts.smoke_installer
          if ($LASTEXITCODE -ne 0) { throw 'Installer lifecycle checks failed' }
      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64
          path: |
            dist/Pointer-v${{ steps.version.outputs.version }}-windows-x64.zip
            dist/Pointer-v${{ steps.version.outputs.version }}-windows-x64.zip.sha256
            dist/Pointer-v${{ steps.version.outputs.version }}-setup-x64.exe
            dist/Pointer-v${{ steps.version.outputs.version }}-setup-x64.exe.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-diagnostics
          path: |
            ${{ runner.temp }}/pointer-diagnostics.json
            .local/reports/installer-smoke.log
            docs/images/desktop-app.png
            docs/images/desktop-tests.png
          if-no-files-found: warn
          retention-days: 14

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-x64
          path: release
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $package = "release/Pointer-v$env:RELEASE_VERSION-windows-x64.zip"
          $installer = "release/Pointer-v$env:RELEASE_VERSION-setup-x64.exe"
          $checksum = "$package.sha256"
          $expected = ((Get-Content -LiteralPath $checksum -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash
          if ($actual -ine $expected) { throw 'Release archive checksum mismatch' }
          $installerChecksum = "$installer.sha256"
          $expectedInstaller = ((Get-Content -LiteralPath $installerChecksum -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ine $expectedInstaller) { throw 'Installer checksum mismatch' }
          $notes = @'
          桌面 APP 预览版：下载安装 EXE，或完整解压 ZIP 后双击 Pointer.exe。
          APP 支持配色、大小、左键动效、自定义节奏、双色预览、内置系统光标测试、开机启动和配置导入导出。
          首次打开后点击“应用配置”启用光标。开机启动由用户选择，关闭界面后后台仍可运行。
          无需 Python 或管理员权限；升级保留配置与原光标备份，卸载前恢复原光标。
          发布包尚未签名；SHA-256 校验文件随包提供。
          '@
          $notesPath = Join-Path $env:RUNNER_TEMP 'pointer-release-notes.md'
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          gh release create $env:RELEASE_TAG $package $checksum $installer $installerChecksum --verify-tag --prerelease --latest=false --title "Pointer $env:RELEASE_TAG 桌面预览版" --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed' }
